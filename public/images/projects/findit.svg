<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-findit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a14"/>
      <stop offset="50%" stop-color="#092019"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <pattern id="grid-findit" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16,185,129,0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-findit)"/>
  <rect width="800" height="450" fill="url(#grid-findit)"/>
  <circle cx="400" cy="170" r="130" fill="#10b981" opacity="0.08" filter="blur(40px)"/>

  <!-- FindIt Campus Map & Radar Locator Graphic -->
  <g transform="translate(400, 160)">
    <!-- Radar Rings -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(16,185,129,0.2)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(16,185,129,0.35)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="20" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="2"/>

    <!-- Crosshairs -->
    <line x1="-90" y1="0" x2="90" y2="0" stroke="rgba(16,185,129,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="-90" x2="0" y2="90" stroke="rgba(16,185,129,0.25)" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Map Pin (Found Item) -->
    <g transform="translate(30, -35)">
      <path d="M 0 0 C -12 -12 -12 -28 0 -40 C 12 -28 12 -12 0 0 Z" fill="#10b981"/>
      <circle cx="0" cy="-26" r="5" fill="#061a14"/>
    </g>

    <!-- Search Magnifying Glass -->
    <g transform="translate(-40, 20)">
      <circle cx="0" cy="0" r="22" fill="#0f291e" stroke="#34d399" stroke-width="3"/>
      <line x1="16" y1="16" x2="32" y2="32" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
      <path d="M -8 -4 L -2 2 L 8 -8" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Card Details Text -->
  <text x="400" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="0.5">
    FindIt — Smart Campus Lost &amp; Found
  </text>
  <text x="400" y="355" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#10b981" letter-spacing="1.5">
    CAMPUS-WIDE RECOVERY &amp; SECURE CLAIM PORTAL
  </text>
  <text x="400" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
    Categorized Catalog • Verified Student Ownership • Location Filtering
  </text>
</svg>
