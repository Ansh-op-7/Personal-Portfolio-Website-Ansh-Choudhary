<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gesture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="cyan-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C8CFF"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid-gesture" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(108,140,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-gesture)"/>
  <rect width="800" height="450" fill="url(#grid-gesture)"/>
  <circle cx="400" cy="180" r="140" fill="#6C8CFF" opacity="0.08" filter="blur(40px)"/>

  <!-- AI / Computer Vision Gesture Landmark Skeleton Graphic -->
  <g transform="translate(400, 170)" stroke="#6C8CFF" stroke-width="2" fill="none">
    <!-- Palm / Wrist Base -->
    <circle cx="0" cy="50" r="6" fill="#6C8CFF"/>
    <circle cx="-35" cy="20" r="5" fill="#6C8CFF"/>
    <circle cx="-15" cy="0" r="5" fill="#6C8CFF"/>
    <circle cx="15" cy="-5" r="5" fill="#6C8CFF"/>
    <circle cx="35" cy="15" r="5" fill="#6C8CFF"/>
    
    <!-- Finger Bones & Joints -->
    <line x1="0" y1="50" x2="-35" y2="20" stroke="rgba(108,140,255,0.4)"/>
    <line x1="0" y1="50" x2="-15" y2="0" stroke="rgba(108,140,255,0.4)"/>
    <line x1="0" y1="50" x2="15" y2="-5" stroke="rgba(108,140,255,0.4)"/>
    <line x1="0" y1="50" x2="35" y2="15" stroke="rgba(108,140,255,0.4)"/>

    <!-- Index Finger -->
    <line x1="-15" y1="0" x2="-20" y2="-35" stroke="#6C8CFF"/>
    <line x1="-20" y1="-35" x2="-22" y2="-65" stroke="#6C8CFF"/>
    <circle cx="-20" cy="-35" r="4" fill="#a855f7"/>
    <circle cx="-22" cy="-65" r="6" fill="#38bdf8"/>

    <!-- Middle Finger -->
    <line x1="15" y1="-5" x2="18" y2="-45" stroke="#6C8CFF"/>
    <line x1="18" y1="-45" x2="20" y2="-75" stroke="#6C8CFF"/>
    <circle cx="18" cy="-45" r="4" fill="#a855f7"/>
    <circle cx="20" cy="-75" r="6" fill="#38bdf8"/>

    <!-- Thumb -->
    <line x1="-35" y1="20" x2="-60" y2="0" stroke="#6C8CFF"/>
    <circle cx="-60" cy="0" r="5" fill="#38bdf8"/>

    <!-- Ring & Pinky curled -->
    <line x1="35" y1="15" x2="45" y2="5" stroke="#6C8CFF"/>
    <circle cx="45" cy="5" r="4" fill="#a855f7"/>

    <!-- MediaPipe Landmark Target Reticle -->
    <circle cx="-22" cy="-65" r="14" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.5"/>
    <circle cx="20" cy="-75" r="14" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.5"/>
  </g>

  <!-- Card Details Text -->
  <text x="400" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="0.5">
    Gesture AI Model
  </text>
  <text x="400" y="355" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6C8CFF" letter-spacing="1.5">
    REAL-TIME OPENCV &amp; MEDIAPIPE COMPUTER VISION
  </text>
  <text x="400" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
    21-Point Skeletal Landmark Tracking • Gesture Media Control
  </text>
</svg>
